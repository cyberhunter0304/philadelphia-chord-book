# Render blueprint for the FastAPI backend.
# Render dashboard → New → Blueprint → pick this repo. It reads this file.
# Two secrets must be set in the dashboard afterwards (sync: false):
#   GOOGLE_API_KEY                 - Google AI Studio key
#   FIREBASE_SERVICE_ACCOUNT_JSON  - paste the full contents of serviceAccountKey.json

services:
  - type: web
    name: chordbook-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: FIREBASE_PROJECT_ID
        value: philadelphia-toolkit-fd760
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: BOOTSTRAP_ADMIN_EMAILS
        value: mjonathanvineeth@gmail.com
      - key: ALLOWED_ORIGINS
        value: https://philadelphia-chord-book.vercel.app
      - key: GOOGLE_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
